name: Archive Slack to Notion

on:
  schedule:
    # GitHub Actions cron is UTC only: 00:17 UTC = 09:17 KST.
    #
    # Three firings, not one, because a scheduled run that collides with a
    # GitHub Actions outage is never queued at all — it vanishes without even a
    # failure notification, and a once-a-month workflow would lose the whole
    # month silently. The 11th and 21st are outage backstops: every channel
    # already 완료 is skipped after one Notion query, without re-reading Slack.
    #
    # The 31st is deliberately absent. It does not exist in five months of the
    # year, so including it would make the gap uneven rather than shorter.
    # month_window() still resolves to the previous month on all three days.
    - cron: "17 0 1,11,21 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Archive month in YYYY-MM format; leave blank for previous month"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: slack-notion-monthly-archive
  cancel-in-progress: false

jobs:
  # README documents bare `python3 archive.py`, so the tool must keep working on
  # the Python that ships with common distros, not just the version CI pins.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  archive:
    needs: test
    runs-on: ubuntu-latest
    # Slack needs one conversations.replies call per thread, so an active
    # workspace is bound by Slack's tier budget, not by our own work. 350 is
    # just under the 360-minute ceiling for GitHub-hosted jobs.
    timeout-minutes: 350
    env:
      ARCHIVE_MONTH: ${{ inputs.month || '' }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      AUTO_JOIN_PUBLIC_CHANNELS: ${{ vars.AUTO_JOIN_PUBLIC_CHANNELS }}
      SLACK_WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
      MAX_IMAGE_MB: ${{ vars.MAX_IMAGE_MB || '200' }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # In-job retries cover what the schedule cannot: a transient Slack or
      # Notion failure that takes out one channel minutes before the next
      # firing is three weeks away. Channels finished by an earlier attempt
      # cost one Notion query each, so a retry only redoes the work that failed.
      - name: Archive the target month
        run: |
          for attempt in 1 2 3; do
            if python archive.py --publish; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt failed; retrying in $((attempt * 300))s"
              sleep $((attempt * 300))
            fi
          done
          exit 1
